<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ポケモンスリープ 食材＆エナジー計算</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="/src/index.css" />

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 p-4">
  <h1 class="text-xl font-bold mb-4">料理から必要な食材とエナジーを計算</h1>

  <div id="categories" class="category-container flex gap-4 overflow-x-auto mb-8">
    <div class="category-block min-w-[320px] bg-white border rounded shadow p-4" id="section-カレー_シチュー">
      <h2 class="text-lg font-semibold mb-2">カレー/シチューの料理選択</h2>
      <div class="input-area flex flex-col gap-2" id="input-カレー_シチュー"></div>
      <div class="flex gap-2 my-2">
        <button id="add-btn-カレー_シチュー" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">料理を追加</button>
        <button onclick="showRecommendations('カレー/シチュー')" class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">おすすめ料理を見る</button>
      </div>
      <h3 class="font-semibold">必要な食材</h3>
      <ul id="result-カレー_シチュー" class="mb-2"></ul>
      <h3 class="font-semibold">合計エナジー</h3>
      <p id="energy-カレー_シチュー">0</p>
    </div>

    <div class="category-block min-w-[320px] bg-white border rounded shadow p-4" id="section-サラダ">
      <h2 class="text-lg font-semibold mb-2">サラダの料理選択</h2>
      <div class="input-area flex flex-col gap-2" id="input-サラダ"></div>
      <div class="flex gap-2 my-2">
        <button id="add-btn-サラダ" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">料理を追加</button>
        <button onclick="showRecommendations('サラダ')" class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">おすすめ料理を見る</button>
      </div>
      <h3 class="font-semibold">必要な食材</h3>
      <ul id="result-サラダ" class="mb-2"></ul>
      <h3 class="font-semibold">合計エナジー</h3>
      <p id="energy-サラダ">0</p>
    </div>

    <div class="category-block min-w-[320px] bg-white border rounded shadow p-4" id="section-ドリンク_デザート">
      <h2 class="text-lg font-semibold mb-2">ドリンク/デザートの料理選択</h2>
      <div class="input-area flex flex-col gap-2" id="input-ドリンク_デザート"></div>
      <div class="flex gap-2 my-2">
        <button id="add-btn-ドリンク_デザート" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">料理を追加</button>
        <button onclick="showRecommendations('ドリンク/デザート')" class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">おすすめ料理を見る</button>
      </div>
      <h3 class="font-semibold">必要な食材</h3>
      <ul id="result-ドリンク_デザート" class="mb-2"></ul>
      <h3 class="font-semibold">合計エナジー</h3>
      <p id="energy-ドリンク_デザート">0</p>
    </div>
  </div>

  <button onclick="calculateAll()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">計算する</button>

  <div class="summary-section mt-8">
    <h2 class="text-lg font-bold mb-2">カテゴリ別食材比較（表形式）</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full border text-sm" id="ingredient-comparison">
        <thead class="bg-gray-200">
          <tr>
            <th class="border px-2 py-1">食材名</th>
            <th class="border px-2 py-1">カレー/シチュー</th>
            <th class="border px-2 py-1">サラダ</th>
            <th class="border px-2 py-1">ドリンク/デザート</th>
            <th class="border px-2 py-1">最大必要数</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
