<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ポケモンスリープ 食材＆エナジー計算</title>
  <link rel="stylesheet" href="/src/index.css" />
</head>
<body>
  <h1>料理から必要な食材とエナジーを計算</h1>

  <div id="categories" class="category-container">
    <div class="category-block" id="section-カレー・シチュー">
      <h2>カレー・シチューの料理選択</h2>
      <div class="input-area" id="input-カレー・シチュー"></div>
      <button id="add-btn-カレー・シチュー" class="btn btn-primary">料理を追加</button>
      <button onclick="showRecommendations('カレー・シチュー')" class="btn btn-warning">おすすめ料理を見る</button>
      <h3>必要な食材</h3>
      <ul id="result-カレー・シチュー"></ul>
      <h3>合計エナジー</h3>
      <p id="energy-カレー・シチュー">0</p>
    </div>

    <div class="category-block" id="section-サラダ">
      <h2>サラダの料理選択</h2>
      <div class="input-area" id="input-サラダ"></div>
      <button id="add-btn-サラダ" class="btn btn-primary">料理を追加</button>
      <button onclick="showRecommendations('サラダ')" class="btn btn-warning">おすすめ料理を見る</button>
      <h3>必要な食材</h3>
      <ul id="result-サラダ"></ul>
      <h3>合計エナジー</h3>
      <p id="energy-サラダ">0</p>
    </div>

    <div class="category-block" id="section-ドリンク・デザート">
      <h2>ドリンク・デザートの料理選択</h2>
      <div class="input-area" id="input-ドリンク・デザート"></div>
      <button id="add-btn-ドリンク・デザート" class="btn btn-primary">料理を追加</button>
      <button onclick="showRecommendations('ドリンク・デザート')" class="btn btn-warning">おすすめ料理を見る</button>
      <h3>必要な食材</h3>
      <ul id="result-ドリンク・デザート"></ul>
      <h3>合計エナジー</h3>
      <p id="energy-ドリンク・デザート">0</p>
    </div>
  </div>

  <button onclick="calculateAll()" class="btn btn-primary">計算する</button>

  <div class="summary-section mt-8">
    <h2 class="table-title">カテゴリ別食材比較（表形式）</h2>
  
    <div class="table-wrapper">
      <table id="ingredient-comparison" class="table-basic">
        <thead class="table-head">
          <tr>
            <th class="table-col">食材名</th>
            <th class="table-col">カレー・シチュー</th>
            <th class="table-col">サラダ</th>
            <th class="table-col">ドリンク・デザート</th>
            <th class="table-col">最大必要数</th>
          </tr>
        </thead>
        <tbody class="table-body">
          <!-- 動的に行が入る -->
        </tbody>
      </table>      
    </div>
  </div>  

  <script type="module" src="/src/main.js"></script>
</body>
</html>
